<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintez Space</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }

        /* Звездное небо */
        .stars {
            position: fixed; top: 0; left: 0; width: 2px; height: 2px;
            background: #fff; border-radius: 50%;
            /* Генерируем много звезд через box-shadow */
            box-shadow: 10vw 10vh #fff, 20vw 80vh #fff, 40vw 30vh #fff, 60vw 60vh #fff, 80vw 20vh #fff, 90vw 90vh #fff, 30vw 50vh #fff, 15vw 40vh #fff, 70vw 15vh #fff, 5vw 60vh #fff;
            opacity: 0.5;
        }

        /* Плавающие градиенты */
        #glow {
            position: fixed; top: 0; left: 0; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15), rgba(75, 0, 130, 0.05), transparent 70%);
            filter: blur(120px); pointer-events: none;
            transition: transform 0.5s ease-out, opacity 1s;
            opacity: 0; z-index: 0;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }

        model-viewer { width: 100vw; height: 100vh; z-index: 1; transition: 0.5s; }
        .interface { position: absolute; top: 40px; left: 40px; z-index: 10; color: #fff; pointer-events: none; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="glow"></div>
    <div id="loader">SINTEZ SPACE</div>

    <div class="interface"><h1>Module 1</h1></div>

    <model-viewer 
        id="model"
        src="room.glb" 
        camera-controls 
        auto-rotate 
        exposure="1"
        shadow-intensity="1">
    </model-viewer>

    <script>
        const model = document.getElementById('model');
        const glow = document.getElementById('glow');
        const loader = document.getElementById('loader');

        model.addEventListener('load', () => loader.style.display = 'none');

        // Эффект появления градиента
        window.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            glow.style.transform = `translate(${e.clientX - 400}px, ${e.clientY - 400}px)`;
        });

        // Подсветка модели при наведении (реакция на свет)
        model.addEventListener('mouseenter', () => {
            model.style.exposure = "2"; // Становится ярче
            model.setAttribute('exposure', '1.8');
        });

        model.addEventListener('mouseleave', () => {
            model.setAttribute('exposure', '1');
        });
    </script>
</body>
</html><button slot="hotspot-desk" data-position="0 0 0" data-normal="0 1 0">Мебель</button>
