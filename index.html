<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintez Space</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* Плавный переход: черный -> фиолетовый -> синий */
            background: linear-gradient(135deg, #000000, #240046, #001233);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1.5s ease-out;
        }

        .loader-text {
            color: #fff;
            font-size: 16px;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
        }

        .interface {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            color: white;
        }
        
        h1 { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.5; margin: 0; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-text">SINTEZ SPACE</div>
    </div>

    <div class="interface">
        <h1>Module 1</h1>
    </div>

    <model-viewer
        src="room.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        camera-orbit="0deg 75deg 8m">
    </model-viewer>

    <script>
        const loader = document.getElementById('loader');
        const viewer = document.querySelector('model-viewer');

        // Скрываем лоадер сразу как модель будет готова
        viewer.addEventListener('load', () => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 1500);
        });
    </script>
</body>
</html>
