<html lang="ru">
<head>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100vh;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Экран загрузки */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }

        .loader-text {
            font-size: 14px;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Основной интерфейс */
        .interface {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        h1 {
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.4;
            margin: 0;;
            height: 100vh;
        }

        /* Убираем стандартные элементы управления загрузкой */
        model-viewer::part(default-progress-bar) {
            display: none;
        }
    </style>
</head>
<body>

    </div>

    <model-viewer
        src="room.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        camera-orbit="0deg 75deg 8m">
    </model-viewer>

    <script>
        const loader = document.getElementById('loader');
        const model = document.querySelector('model-viewer');

        // Когда модель загружена, скрываем экран загрузки
        model.addEventListener('load', () => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 1000); // Ждем завершения transition

    </script>
