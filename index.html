<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 1 - Dark Edition</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ffffff; /* Белый текст для контраста */
            --glass: rgba(0, 0, 0, 0.5); /* Темное стекло */
        }

        body {
            margin: 0;
            padding: 0;
            /* Глубокий темный градиент */
            background: radial-gradient(circle at top right, #1a1a1a, #000000);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .interface {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            padding: 20px 30px;
            background: var(--glass);
            backdrop-filter: blur(15px); /* Усиленное размытие */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .subtitle {
            margin-top: 8px;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
        }

        .line {
            width: 40px;
            height: 1px;
            background: var(--accent);
            margin-bottom: 15px;
            opacity: 0.8;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
            outline: none;
            /* Убираем стандартную тень под моделью, чтобы она не сливалась с черным фоном */
            --poster-color: transparent;
        }
    </style>
</head>
<body>

    <div class="interface">
        <div class="line"></div>
        <h1>Module 1</h1>
        <div class="subtitle">Spatial Experience / 2026</div>
    </div>

    <model-viewer 
        src="room.glb" 
        alt="3D Room Concept" 
        auto-rotate 
        camera-controls 
        shadow-intensity="2" 
        shadow-softness="1"
        exposure="1.3" 
        environment-image="neutral">
    </model-viewer>

</body>
</html>
