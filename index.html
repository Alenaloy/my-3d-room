<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintez Space</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        /* Эффект звездного неба */
        .stars {
            position: fixed; top: 0; left: 0; width: 1px; height: 1px;
            background: transparent;
            box-shadow: 10vw 20vh #fff, 50vw 80vh #fff, 80vw 30vh #fff, 20vw 90vh #fff, 90vw 10vh #fff;
            opacity: 0.3;
        }

        #cursor-glow {
            position: fixed; top: 0; left: 0;
            width: 500px; height: 500px;
            /* Более глубокий фиолетовый перелив */
            background: radial-gradient(circle, rgba(138, 43, 226, 0.2), rgba(75, 0, 130, 0.1), transparent 70%);
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.2s ease-out;
            z-index: 0;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 1.5s ease-out;
        }

        .loader-text {
            font-size: 14px; letter-spacing: 0.5em; text-transform: uppercase;
            opacity: 0.5;
        }

        model-viewer { width: 100vw; height: 100vh; z-index: 1; position: relative; }

        .interface { position: absolute; top: 40px; left: 40px; z-index: 10; pointer-events: none; }
        h1 { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.6; margin: 0; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="cursor-glow"></div>
    <div id="loader"><div class="loader-text">SINTEZ SPACE</div></div>

    <div class="interface"><h1>Module 1</h1></div>

    <model-viewer src="room.glb" camera-controls auto-rotate shadow-intensity="1" camera-orbit="0deg 75deg 8m"></model-viewer>

    <script>
        const loader = document.getElementById('loader');
        const glow = document.getElementById('cursor-glow');
        document.querySelector('model-viewer').addEventListener('load', () => { 
            loader.style.opacity = '0'; 
            setTimeout(() => loader.style.display = 'none', 1500); 
        });

        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            glow.style.opacity = '1';
        });
    </script>
</body>
</html>
