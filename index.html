<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintez Space</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }

        /* Звездное небо */
        .stars {
            position: fixed; top: 0; left: 0; width: 2px; height: 2px;
            background: #fff; border-radius: 50%;
            box-shadow: 10vw 10vh #fff, 20vw 80vh #fff, 40vw 30vh #fff, 60vw 60vh #fff, 80vw 20vh #fff, 90vw 90vh #fff, 30vw 50vh #fff, 15vw 40vh #fff, 70vw 15vh #fff, 95vw 5vw #fff, 5vw 60vh #fff, 45vw 12vh #fff;
            opacity: 0.3;
        }

        /* Плавающий градиент */
        #glow {
            position: fixed; top: 0; left: 0; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15), rgba(75, 0, 130, 0.05), transparent 70%);
            filter: blur(120px); pointer-events: none;
            transition: transform 0.5s ease-out, opacity 1s;
            opacity: 0; z-index: 0;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 1000; color: #fff; letter-spacing: 0.5em; text-transform: uppercase;
        }

        model-viewer { 
            width: 100vw; height: 100vh; z-index: 1; 
            transition: exposure 0.8s ease; /* Плавное изменение яркости */
        }
        
        .interface { position: absolute; top: 40px; left: 40px; z-index: 10; color: #fff; pointer-events: none; }
        h1 { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.6; margin: 0; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="glow"></div>
    <div id="loader">SINTEZ SPACE</div>

    <div class="interface"><h1>Module 1</h1></div>

    <model-viewer 
        id="model"
        src="https://raw.githubusercontent.com/Alenaloy/my-3d-room/main/room.glb" 
        camera-controls 
        auto-rotate 
        exposure="0.7" 
        shadow-intensity="1">
    </model-viewer>

    <script>
        const model = document.getElementById('model');
        const glow = document.getElementById('glow');
        const loader = document.getElementById('loader');

        model.addEventListener('load', () => loader.style.display = 'none');

        window.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            glow.style.transform = `translate(${e.clientX - 400}px, ${e.clientY - 400}px)`;
        });

        // При наведении делаем модель чуть ярче (до 1.2), убираем — обратно в 0.7
        model.addEventListener('mouseenter', () => model.setAttribute('exposure', '1.2'));
        model.addEventListener('mouseleave', () => model.setAttribute('exposure', '0.7'));
    </script>
</body>
</html>
