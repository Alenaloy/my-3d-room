<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Experience | Module 1</title>
    
    <!-- Используем последнюю версию -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--accent);
        }

        .interface {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
            padding: 24px 32px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            pointer-events: none; /* Чтобы не мешало вращению модели */
        }

        h1 {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
            /* Убираем стандартные кнопки, если они не нужны для дизайна */
            --progress-bar-color: #ffffff;
            --progress-bar-height: 2px;
        }

        /* Стильный лоадер */
        .progress-bar {
            display: block;
            width: 33%;
            height: 10%;
            max-height: 2px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate3d(-50%, -50%, 0);
            background-image: linear-gradient(to right, #fff, #333);
        }
    </style>
</head>
<body>

    <div class="interface">
        <h1>Module 1</h1>
    </div>

    <model-viewer
        src="room.glb"
        alt="3D room model"
        auto-rotate
        camera-controls
        touch-action="pan-y"
        exposure="1.3"
        shadow-intensity="1"
        camera-orbit="45deg 75deg 10m"
        loading="eager">
        
        <!-- Добавляем полосу загрузки -->
        <div class="progress-bar" slot="progress-bar"></div>
    </model-viewer>

</body>
</html>
