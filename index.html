
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Concept | Module 1</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* Эффект свечения за моделью */
        .glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .interface {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        h1 {
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            border-left: 1px solid #fff;
            padding-left: 15px;
            margin: 0;
            opacity: 0.6;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Плавное проявление при загрузке */
            transition: opacity 1.5s ease;
        }

        /* Скрываем всё, что стандартно идет с моделью */
        model-viewer::part(default-progress-bar) {
            display: none;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="interface">
        <h1>Module 1</h1>
    </div>

    <model-viewer
        src="room.glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="10deg"
        shadow-intensity="0"
        exposure="1"
        camera-orbit="0deg 75deg 8m"
        min-camera-orbit="auto auto 5m"
        max-camera-orbit="auto auto 15m"
        interpolation-decay="200">
    </model-viewer>

    <script>
        // Скрипт для плавного появления модели после загрузки
        const model = document.querySelector('model-viewer');
        model.style.opacity = "0";
        model.addEventListener('load', () => {
            model.style.opacity = "1";
        });
    </script>
</body>
</html>
