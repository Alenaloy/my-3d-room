<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя 3D комната</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --accent-color: #ff007a;
        }
        body { 
            margin: 0; 
            background: radial-gradient(circle, #2c3e50, #000000); 
            font-family: sans-serif;
            overflow: hidden;
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            border-left: 4px solid var(--accent-color);
            padding-left: 15px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <h1>My 3D Space</h1>
        <p>Интерактивная визуализация</p>
    </div>

    <model-viewer 
        src="room.glb" 
        alt="3D модель" 
        auto-rotate 
        camera-controls 
        shadow-intensity="2" 
        exposure="1.2">
    </model-viewer>

</body>
</html>
